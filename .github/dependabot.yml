version: 2
updates:
  - package-ecosystem: "maven"
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '22:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '22:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /.devcontainer/docker/cd
    schedule:
      interval: weekly
      day: friday
      time: '22:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /.devcontainer/docker/java
    schedule:
      interval: weekly
      day: friday
      time: '22:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /.devcontainer/docker/prod
    schedule:
      interval: weekly
      day: friday
      time: '22:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
